
name: Refresh static RSS feeds

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-static-rss-feeds
  cancel-in-progress: false

jobs:
  refresh-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild feed listings
        run: python scripts/build_static_feeds.py

      - name: Refresh archive footers
        run: python scripts/refresh_archive_footers.py --apply

      - name: Commit updated feed listings and archive pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Refresh static RSS feeds"

            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Feed updates pushed successfully."
                exit 0
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Could not push feed updates after 3 attempts." >&2
                exit 1
              fi

              echo "Push attempt $attempt failed; syncing with the latest main branch."
              git fetch --no-tags --unshallow origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase feed updates; review concurrent edits to generated files." >&2
                exit 1
              fi
            done
          fi
