name: Apply archive SEO metadata (temporary PR workflow)

on:
  push:
    branches:
      - seo-archive-metadata-2026-10-21

permissions:
  contents: write

jobs:
  metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Normalize metadata without changing page bodies
        run: python3 scripts/seo_archive_metadata.py --apply
      - name: Verify normalization is idempotent
        run: python3 scripts/seo_archive_metadata.py --check
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit only modified HTML files to this review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "All SEO metadata is already normalized."
          else
            git commit -m "SEO: normalize metadata across remaining static archive"
            git push origin HEAD:seo-archive-metadata-2026-10-21
          fi
