name: Reading Companion batch 17 latency stage profile

on:
  workflow_dispatch:
    inputs:
      confirm_live_ai:
        description: I understand this runs four paired questions against live Worker AI and incurs AI usage
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Keep paired latency measurements isolated from all other evaluation workflows.
concurrency:
  group: reading-companion-cross-run-regression
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_live_ai }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify explicit live AI confirmation and evaluation token
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          test "${{ inputs.confirm_live_ai }}" = "true"
          test -n "$PILOT_EVALUATION_TOKEN"
          mkdir -p "$GITHUB_WORKSPACE/reading-companion-batch-17-stage-profile"
      - name: Run one paired pass over four registered questions
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode transport-ab --scope case-default --case stage-profile-4 \
            --repeat 1 --answer-variant transport-ab \
            --retrieval-profile baseline --report-only true \
            --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-batch-17-stage-profile/report.json"
      - name: Preserve paired traces and rubric-v2 scorecard template
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-companion-batch-17-stage-profile
          path: ${{ github.workspace }}/reading-companion-batch-17-stage-profile/*.json
          if-no-files-found: warn
          retention-days: 30
