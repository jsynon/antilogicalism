name: Reading Companion three philosophy trace evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_live_ai:
        description: I understand these three questions call the live Worker and incur Cloudflare AI usage
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: reading-companion-philosophy3-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_live_ai }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify explicit live AI confirmation and evaluation token
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          test "${{ inputs.confirm_live_ai }}" = "true"
          test -n "$PILOT_EVALUATION_TOKEN"
      - name: Test evaluation guards and report checks
        run: node --test reading-companion/live-answer-evaluation.test.mjs
      - name: Run three all-books questions with review and authenticated traces
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode philosophy3 \
            --scope case-default \
            --answer-variant with-review \
            --case all \
            --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-philosophy3-traces.json"
      - name: Preserve full evaluation report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-companion-philosophy3-traces
          path: ${{ github.workspace }}/reading-companion-philosophy3-traces.json
          if-no-files-found: warn
          retention-days: 14
