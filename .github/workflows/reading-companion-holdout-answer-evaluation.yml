name: Reading Companion live answer evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Development regression cases, focused user questions, or the frozen acceptance set
        type: choice
        options:
          - holdout
          - focused
          - acceptance
        default: holdout
        required: true
      case_id:
        description: Run one case from the selected suite or all cases in that suite
        type: choice
        options:
          - all
          - holdout-history-herodotus-helen
          - holdout-literature-hamlet-soliloquy
          - holdout-philosophy-aristotle-soul-body
          - holdout-religion-james-faith-works
          - holdout-all-books-hume-kant-causation
          - holdout-all-books-plato-rousseau-order
          - holdout-all-books-wollstonecraft-dubois
          - focused-kant-transcendental-idealism
          - focused-kierkegaard-faith
          - focused-nietzsche-christianity
          - focused-sunyata
          - focused-nietzsche-kierkegaard
          - acceptance-descartes-cogito
          - acceptance-mill-harm-principle
          - acceptance-epictetus-freedom
          - acceptance-augustine-memory
          - acceptance-aristotle-tragedy-plot
          - acceptance-boethius-fortune
          - acceptance-locke-political-authority
          - acceptance-god-is-love
          - acceptance-simulation-hypothesis
          - acceptance-buddha-on-death
        default: all
        required: true
      answer_variant:
        description: Paired mode runs both variants on the same pages; about 3 calls per selected-books case or 4 per all-books case, plus bounded recovery
        type: choice
        options:
          - with-review
          - compose-only
          - paired-review-ablation
        default: with-review
        required: true
      scope:
        description: Selected-books honors each case's configured books and queries; All Books removes restrictions and uses the live planner. Acceptance requires All Books
        type: choice
        options:
          - selected-books
          - all-books
        default: selected-books
        required: true
      confirm_live_ai:
        description: I understand this sends questions to the live Worker and uses Cloudflare AI
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: reading-companion-live-answer-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_live_ai }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIVE_EVAL_MODE: ${{ inputs.suite }}
      LIVE_EVAL_SCOPE: ${{ inputs.scope }}
      LIVE_EVAL_CASE_ID: ${{ inputs.case_id }}
      LIVE_EVAL_ANSWER_VARIANT: ${{ inputs.answer_variant }}
      CONFIRM_LIVE_AI: ${{ inputs.confirm_live_ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate explicit cost confirmation
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          test "$CONFIRM_LIVE_AI" = "true"
          test -n "$PILOT_EVALUATION_TOKEN"
      - name: Test evaluation guards and report checks
        run: node --test reading-companion/live-answer-evaluation.test.mjs
      - name: Run confirmed holdout evaluation
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
          LIVE_EVAL_OUTPUT: ${{ github.workspace }}/reading-companion-holdout-answer-evaluation.json
        run: node reading-companion/live-answer-evaluation.mjs --mode "$LIVE_EVAL_MODE" --scope "$LIVE_EVAL_SCOPE" --answer-variant "$LIVE_EVAL_ANSWER_VARIANT" --case "$LIVE_EVAL_CASE_ID" --confirm-live-ai true --output "$LIVE_EVAL_OUTPUT"
      - name: Save holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-companion-${{ inputs.suite }}-answer-evaluation-${{ inputs.answer_variant }}-${{ inputs.scope }}-${{ inputs.case_id }}
          path: ${{ github.workspace }}/reading-companion-holdout-answer-evaluation.json
          if-no-files-found: warn
          retention-days: 14

