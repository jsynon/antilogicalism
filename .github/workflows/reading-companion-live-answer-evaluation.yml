name: Reading Companion live answer evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run planner checks, smoke or quality baselines, five focused source cases, or all 30 benchmark questions
        type: choice
        options:
          - planner
          - smoke
          - quality
          - focused
          - full
        default: smoke
        required: true
      case_id:
        description: In quality mode all seven baseline questions remain the default; focused mode runs the focused questions or one selected case
        type: choice
        options:
          - all
          - quality-science-darwin-selection
          - quality-history-thucydides-causes
          - quality-literature-dostoevsky-raskolnikov
          - quality-philosophy-aristotle-practical-wisdom
          - quality-all-books-cross-work-science
          - quality-all-books-cross-discipline-order
          - quality-all-books-religion-scripture
          - focused-kant-transcendental-idealism
          - focused-kierkegaard-faith
          - focused-nietzsche-christianity
          - focused-sunyata
          - focused-nietzsche-kierkegaard
        default: all
        required: true
      scope:
        description: Quality mode can use selected-book or All Books scope; focused cases always use All Books and the live planner
        type: choice
        options:
          - selected-books
          - all-books
        default: selected-books
        required: true
      confirm_live_ai:
        description: I understand this sends questions to the live Worker and uses Cloudflare AI
        type: boolean
        default: false
        required: true
      confirm_full_30:
        description: I explicitly approve the full 30-question run (required only for full mode)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: reading-companion-live-answer-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_live_ai }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIVE_EVAL_MODE: ${{ inputs.mode }}
      LIVE_EVAL_SCOPE: ${{ inputs.scope }}
      LIVE_EVAL_CASE_ID: ${{ inputs.case_id }}
      CONFIRM_LIVE_AI: ${{ inputs.confirm_live_ai }}
      CONFIRM_FULL_30: ${{ inputs.confirm_full_30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate explicit cost confirmations
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          test "$CONFIRM_LIVE_AI" = "true"
          if [ "$LIVE_EVAL_MODE" = "full" ]; then test "$CONFIRM_FULL_30" = "true"; fi
          test -n "$PILOT_EVALUATION_TOKEN"
      - name: Test evaluation guards and report checks
        run: node --test reading-companion/live-answer-evaluation.test.mjs
      - name: Run confirmed live evaluation
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
          LIVE_EVAL_OUTPUT: ${{ github.workspace }}/reading-companion-live-answer-evaluation.json
        run: node reading-companion/live-answer-evaluation.mjs --mode "$LIVE_EVAL_MODE" --scope "$LIVE_EVAL_SCOPE" --case "$LIVE_EVAL_CASE_ID" --confirm-live-ai true --output "$LIVE_EVAL_OUTPUT"
      - name: Save live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-companion-live-answer-evaluation-${{ inputs.mode }}-${{ inputs.scope }}-${{ inputs.case_id }}
          path: ${{ github.workspace }}/reading-companion-live-answer-evaluation.json
          if-no-files-found: warn
          retention-days: 14
