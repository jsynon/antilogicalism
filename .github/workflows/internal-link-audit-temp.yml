name: Site internal-link audit (temporary)
on:
  push:
    branches: [audit-internal-link-crawlability-2026-11-09]
permissions:
  contents: read
jobs:
  internal-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit published HTML pages and crawl graph
        run: python3 scripts/audit_internal_links_temp.py | tee internal-link-audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: internal-link-crawlability-2026-11-09
          path: |
            internal-link-audit-results.json
            internal-link-audit.log
          retention-days: 30
