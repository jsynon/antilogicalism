name: Reading Companion answer quality benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Run calibration, one selected acceptance question, or the full frozen acceptance set; or run the current fresh five-question set
        type: choice
        options:
          - calibration
          - single-case
          - acceptance
          - fresh-five
          - fresh-single-case
        default: fresh-five
        required: true
      case_id:
        description: Frozen acceptance question for suite single-case; ignored otherwise
        type: choice
        options:
          - acceptance-descartes-cogito
          - acceptance-mill-harm-principle
          - acceptance-epictetus-freedom
          - acceptance-augustine-memory
          - acceptance-aristotle-tragedy-plot
          - acceptance-boethius-fortune
          - acceptance-locke-political-authority
          - acceptance-god-is-love
          - acceptance-simulation-hypothesis
          - acceptance-buddha-on-death
          - acceptance-life-meaning-authors
        default: acceptance-buddha-on-death
        required: true
      fresh_case_id:
        description: Fresh question to run when suite is fresh-single-case; ignored by other suites
        type: choice
        options:
          - fresh2-all-freedom-circumstances
          - fresh2-all-nature-responsibility
          - fresh2-all-belief-conduct
          - fresh2-selected-walden-necessities
          - fresh2-selected-austen-first-impressions
        default: fresh2-all-freedom-circumstances
        required: true
      repeat_count:
        description: Attempts per calibration or fresh question; frozen acceptance always runs once
        type: choice
        options:
          - '1'
          - '3'
        default: '1'
        required: true
      retrieval_profile:
        description: Compare the current retrieval budget with a wider candidate pool
        type: choice
        options:
          - baseline
          - expanded
        default: baseline
        required: true
      answer_experiment:
        description: Choose the answer pipeline comparison; selection comparison is evaluation-only
        type: choice
        options:
          - standard
          - compare-expansion
          - compare-selection
        default: standard
        required: true
      confirm_live_ai:
        description: I understand this uses live Worker AI; selection comparison adds three Worker calls per question (one selector and two answer runs)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: reading-companion-live-answer-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_live_ai }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCHMARK_SUITE: ${{ inputs.suite }}
      BENCHMARK_CASE_ID: ${{ inputs.case_id }}
      BENCHMARK_FRESH_CASE_ID: ${{ inputs.fresh_case_id }}
      BENCHMARK_REPEAT_COUNT: ${{ inputs.repeat_count }}
      BENCHMARK_RETRIEVAL_PROFILE: ${{ inputs.retrieval_profile }}
      BENCHMARK_ANSWER_EXPERIMENT: ${{ inputs.answer_experiment }}
      CONFIRM_LIVE_AI: ${{ inputs.confirm_live_ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm suite and evaluation credentials
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          test "$CONFIRM_LIVE_AI" = "true"
          test -n "$PILOT_EVALUATION_TOKEN"
          if [ "$BENCHMARK_SUITE" = "acceptance" ]; then
            test "$BENCHMARK_REPEAT_COUNT" = "1"
          fi
      - name: Run one consolidated quality benchmark
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
          LIVE_EVAL_OUTPUT: ${{ github.workspace }}/reading-companion-quality-benchmark.json
        run: |
          if [ "$BENCHMARK_SUITE" = "calibration" ]; then
            mode=acceptance; scope=all-books; case_id=quality-calibration
            repeat_count="$BENCHMARK_REPEAT_COUNT"
          elif [ "$BENCHMARK_SUITE" = "single-case" ]; then
            mode=acceptance; scope=all-books; case_id="$BENCHMARK_CASE_ID"
            repeat_count="$BENCHMARK_REPEAT_COUNT"
          elif [ "$BENCHMARK_SUITE" = "fresh-five" ]; then
            mode=fresh; scope=case-default; case_id=all
            repeat_count="$BENCHMARK_REPEAT_COUNT"
          elif [ "$BENCHMARK_SUITE" = "fresh-single-case" ]; then
            mode=fresh; scope=case-default; case_id="$BENCHMARK_FRESH_CASE_ID"
            repeat_count="$BENCHMARK_REPEAT_COUNT"
          else
            mode=acceptance; scope=all-books; case_id=all
            repeat_count=1
          fi
          if [ "$BENCHMARK_ANSWER_EXPERIMENT" = "compare-expansion" ]; then
            answer_variant=paired-expansion-ablation
          elif [ "$BENCHMARK_ANSWER_EXPERIMENT" = "compare-selection" ]; then
            answer_variant=paired-selection-ablation
          else
            answer_variant=with-review
          fi
          node reading-companion/live-answer-evaluation.mjs \
            --mode "$mode" \
            --scope "$scope" \
            --case "$case_id" \
            --repeat "$repeat_count" \
            --retrieval-profile "$BENCHMARK_RETRIEVAL_PROFILE" \
            --answer-variant "$answer_variant" \
            --report-only true \
            --confirm-live-ai true \
            --output "$LIVE_EVAL_OUTPUT"
      - name: Save complete quality-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-companion-quality-benchmark-${{ inputs.suite }}-${{ inputs.suite == 'single-case' && inputs.case_id || (inputs.suite == 'fresh-single-case' && inputs.fresh_case_id) || 'all-cases' }}-${{ inputs.retrieval_profile }}-${{ inputs.answer_experiment }}
          path: ${{ github.workspace }}/reading-companion-quality-benchmark.json
          if-no-files-found: warn
          retention-days: 30
