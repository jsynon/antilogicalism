name: Reading Companion v1.10 website smoke

on:
  pull_request:
    paths:
      - 'reading-companion/**'
      - '.github/workflows/reading-companion-v110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check reading-companion/companion-v110.mjs
          node --check reading-companion/remote-library.mjs
          node --test reading-companion/companion-v110.test.mjs
