name: Reading Companion v1.10 website smoke

on:
  pull_request:
    paths:
      - 'reading-companion/**'
      - '.github/workflows/reading-companion-v110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check reading-companion/companion-v110.mjs
          node --check reading-companion/remote-library.mjs
          node --check reading-companion/companion-v110.mjs
          node --check reading-companion/source-reader.mjs
          node --check reading-companion/source-text-format.mjs
          node --test reading-companion/*.test.mjs
      - name: Read-only interdisciplinary retrieval audit against published v47
        run: node reading-companion/evaluate-retrieval.mjs
      - name: Offline semantic feasibility against four indexed books (not deployed)
        run: |
          python -m pip install --quiet numpy scikit-learn
          python reading-companion/evaluate-semantic.py
