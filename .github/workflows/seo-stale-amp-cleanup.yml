name: Clean obsolete AMP tags (temporary)
on:
  push:
    branches:
      - seo-remove-stale-amp-2026-10-21
permissions:
  contents: write
jobs:
  remove-amp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove stale amphtml declarations, preserving bodies
        run: python3 scripts/remove_stale_amp.py --apply
      - name: Verify no AMP references remain
        run: python3 scripts/remove_stale_amp.py --check
      - name: Check diffs for whitespace errors
        run: git diff --check
      - name: Commit only affected HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "No updates necessary."
          else
            git commit -m "SEO: remove invalid WordPress AMP links from static site"
            git push origin HEAD:seo-remove-stale-amp-2026-10-21
          fi
