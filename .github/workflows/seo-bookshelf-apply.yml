name: Apply preferred Bookshelf SEO (temporary)

on:
  push:
    branches:
      - seo-preferred-bookshelf-2026-10-21

permissions:
  contents: write

jobs:
  bookshelf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update main Bookshelf index and legacy search signals
        run: python3 scripts/consolidate_bookshelf_seo.py --apply
      - name: Verify result is idempotent
        run: python3 scripts/consolidate_bookshelf_seo.py --check
      - name: Check patch formatting
        run: git diff --check
      - name: Commit content-preserving HTML and sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- primary-sources sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "SEO: consolidate Bookshelf discovery on single preferred page"
            git push origin HEAD:seo-preferred-bookshelf-2026-10-21
          fi
