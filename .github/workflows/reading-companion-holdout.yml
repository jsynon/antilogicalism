name: Reading Companion evaluation (holdout)

on:
  workflow_dispatch:
    inputs:
      confirm_live_ai:
        description: I understand this runs the holdout (library-holdout, library-holdout-selected) live Worker evaluations repeatedly in a single run and incurs AI usage
        type: boolean
        required: true
        default: false
      repeats:
        description: How many full passes over each suite to run inside this single workflow run
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        required: true
        default: '2'

permissions:
  contents: read

# Share the cross-run regression group so this workflow and the other
# evaluation workflows can never run simultaneously and distort each
# other's latency measurements.
concurrency:
  group: reading-companion-cross-run-regression
  cancel-in-progress: false

# The holdout suites are a generalization measurement: 16 questions
# (8 all-books themes, 8 selected books) that no tranche was designed
# against. One job, both suites, passes sequential — the same
# measurement conditions as the phase-2/phase-3 workflow.

jobs:
  holdout:
    if: ${{ inputs.confirm_live_ai }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify explicit live AI confirmation and evaluation token
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          test "${{ inputs.confirm_live_ai }}" = "true"
          test -n "$PILOT_EVALUATION_TOKEN"
          mkdir -p "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation"
      - name: Pass 1 — library-holdout suite
        if: ${{ !cancelled() }}
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode library-holdout --scope case-default --case all --repeat 1 \
            --answer-variant with-review --retrieval-profile baseline \
            --report-only true --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation/library-holdout-pass1.json"
      - name: Pass 1 — library-holdout-selected suite
        if: ${{ !cancelled() }}
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode library-holdout-selected --scope case-default --case all --repeat 1 \
            --answer-variant with-review --retrieval-profile baseline \
            --report-only true --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation/library-holdout-selected-pass1.json"
      - name: Pass 2 — library-holdout suite
        if: ${{ !cancelled() && inputs.repeats != '1' }}
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode library-holdout --scope case-default --case all --repeat 1 \
            --answer-variant with-review --retrieval-profile baseline \
            --report-only true --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation/library-holdout-pass2.json"
      - name: Pass 2 — library-holdout-selected suite
        if: ${{ !cancelled() && inputs.repeats != '1' }}
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode library-holdout-selected --scope case-default --case all --repeat 1 \
            --answer-variant with-review --retrieval-profile baseline \
            --report-only true --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation/library-holdout-selected-pass2.json"
      - name: Pass 3 — library-holdout suite
        if: ${{ !cancelled() && inputs.repeats == '3' }}
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode library-holdout --scope case-default --case all --repeat 1 \
            --answer-variant with-review --retrieval-profile baseline \
            --report-only true --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation/library-holdout-pass3.json"
      - name: Pass 3 — library-holdout-selected suite
        if: ${{ !cancelled() && inputs.repeats == '3' }}
        env:
          PILOT_EVALUATION_TOKEN: ${{ secrets.PILOT_EVALUATION_TOKEN }}
        run: |
          node reading-companion/live-answer-evaluation.mjs \
            --mode library-holdout-selected --scope case-default --case all --repeat 1 \
            --answer-variant with-review --retrieval-profile baseline \
            --report-only true --confirm-live-ai true \
            --output "$GITHUB_WORKSPACE/reading-companion-holdout-evaluation/library-holdout-selected-pass3.json"
      - name: Preserve all holdout evaluation reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-companion-holdout-evaluation
          path: ${{ github.workspace }}/reading-companion-holdout-evaluation/*.json
          if-no-files-found: warn
          retention-days: 30
